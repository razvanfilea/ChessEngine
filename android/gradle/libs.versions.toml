[versions]
agp = "9.4.1"
androidx_datastore_preferences = "1.2.1"
kotlin_base = "2.4.20"
kotlin_coroutines = "1.11.0"
compose_base = "1.12.1"
compose_activity = "1.13.0"
compose_material3 = "1.4.0"
androidx_core = "1.19.1"
androidx_viewmodelCompose = "2.11.0"
wear_compose = "1.7.0"

[plugins]
android_application = { id = "com.android.application", version.ref = "agp" }
android_library = { id = "com.android.library", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin_base" }


[libraries]
datastorePreferences = { module = "androidx.datastore:datastore-preferences", version.ref = "androidx_datastore_preferences" }
kotlin_coroutinesAndroid = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlin_coroutines" }

androidx_core = { group = "androidx.core", name = "core-ktx", version.ref = "androidx_core" }
androidx_viewmodelCompose  = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx_viewmodelCompose"}

compose_foundation = { module = "androidx.compose.foundation:foundation", version.ref = "compose_base" }
compose_ui = { module = "androidx.compose.ui:ui", version.ref = "compose_base" }
compose_material3 = { module = "androidx.compose.material3:material3", version.ref = "compose_material3" }
compose_animation = { module = "androidx.compose.animation:animation-graphics-android", version.ref = "compose_base" }
compose_tooling = { module = "androidx.compose.ui:ui-tooling", version.ref = "compose_base" }
compose_toolingPreview = { module = "androidx.compose.ui:ui-tooling-preview", version.ref = "compose_base" }
compose_activity = { module = "androidx.activity:activity-compose", version.ref = "compose_activity" }

wear_compose_foundation = { module = "androidx.wear.compose:compose-foundation", version.ref = "wear_compose" }
wear_compose_material3 = { module = "androidx.wear.compose:compose-material3", version.ref = "wear_compose" }
