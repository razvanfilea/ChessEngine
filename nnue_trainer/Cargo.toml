[package]
name = "nnue_trainer"
version.workspace = true
edition.workspace = true
authors.workspace = true
publish = false

[dependencies]
bullet_lib = { git = "https://github.com/jw1912/bullet", package = "bullet_lib" }
chess_engine = { workspace = true, optional = true }

[features]
default = []
rocm = ["bullet_lib/rocm"]
cuda = ["bullet_lib/cuda"]
metal = ["bullet_lib/metal"]

[[bin]]
name = "trainer"

[[bin]]
name = "parity"
required-features = ["chess_engine"]
